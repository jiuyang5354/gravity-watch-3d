name: GravityWatchStudio
options:
  bundleIdPrefix: com.gravitystudio
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_LANGUAGE: zh-Hans

targets:
  GravityWatchStudio:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: iOSApp
      - path: Shared
        excludes:
          - "Resources/**"
      - path: Shared/Resources/PBRTextures
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gravitystudio.watchface
        PRODUCT_NAME: GravityWatchStudio
        INFOPLIST_FILE: iOSApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    dependencies:
      - target: GravityWatchFaceWatch
        embed: true

  GravityWatchFaceWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: WatchApp
      - path: Shared
        excludes:
          - "Resources/**"
      - path: Shared/Resources/PBRTextures
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gravitystudio.watchface.watchkitapp
        PRODUCT_NAME: GravityWatchFaceWatch
        INFOPLIST_FILE: WatchApp/Info.plist
        COMPANION_APP_BUNDLE_IDENTIFIER: com.gravitystudio.watchface
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "4"

schemes:
  GravityWatchStudio:
    build:
      targets:
        GravityWatchStudio: all
    run:
      config: Debug
  GravityWatchFaceWatch:
    build:
      targets:
        GravityWatchFaceWatch: all
    run:
      config: Debug
